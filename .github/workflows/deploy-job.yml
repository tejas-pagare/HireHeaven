name: Deploy Job Service to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'services/job/**'
      - '.github/workflows/deploy-job.yml'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: us-central1 # Artifact Registry location (change to your region if different)
  REPOSITORY: job-portal-repo # Artifact Registry repository name
  SERVICE: job-portal-job
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup authentication to Google Cloud using a Service Account JSON key
      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      # Configure Docker to push to Google Artifact Registry
      - name: Docker Auth
        id: docker-auth
        run: |
          gcloud auth configure-docker "${{ env.GAR_LOCATION }}-docker.pkg.dev"

      # Build the Docker image
      - name: Build Docker Image
        run: |
          docker build -t "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}" ./services/job

      # Push the Docker image to Google Artifact Registry
      - name: Push Docker Image
        run: |
          docker push "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"

      # Deploy the newly pushed image to Google Cloud Run
      - name: Deploy to Cloud Run
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: '${{ env.SERVICE }}'
          region: '${{ env.REGION }}'
          image: '${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}'
          # Passing standard environment variables
          # Sensitive ones (like JWT_SECRET, DATABASE_URL) should be added directly in the GCP Cloud Run Console
          env_vars: |
            PORT=5003
            NODE_ENV=production
